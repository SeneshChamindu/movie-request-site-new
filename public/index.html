<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Request Bot</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header><h1>MOVIE REQUEST BOT</h1><p>Created By Senesh Chamindu</p></header>
<main>
<form id="searchForm"><input id="searchInput" placeholder="Search movie titles..." required><button>Search</button></form>
<section id="resultsSection"><h2>Search Results</h2><div id="results"></div></section>
<section id="detailsSection" class="hidden"><div id="movieDetails"></div><form id="requestForm"><label>WhatsApp Number</label><input id="phoneInput" required><button>Send Movie Request</button></form></section>
<section id="successSection" class="hidden"><h2>Request Submitted!</h2><div id="requestSummary"></div><a id="whatsappLink" href="#">Join WhatsApp Group</a></section>
<section><h2>Request Queue</h2><div id="queue"></div></section>
</main>
<footer>Created By Senesh Chamindu © 2026</footer>
<script src="/app.js"></script>
</body>
</html>
